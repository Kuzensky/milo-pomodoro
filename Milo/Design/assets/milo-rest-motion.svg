<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title-rest desc-rest">
<title id="title-rest">Milo — taking a break</title>
<desc id="desc-rest">Editable vector redraw from the supplied reference. Separate named parts for animation. Transparent background.</desc><style>
    #motion-body {transform-box:fill-box;transform-origin:50% 95%;animation:breathe 5.2s ease-in-out infinite}
    #tail {transform-box:fill-box;transform-origin:10% 10%;animation:sway 5.2s ease-in-out infinite}
    #eyes,#pupils {transform-box:fill-box;transform-origin:center;animation:blink 7.1s linear infinite}
    @keyframes breathe {0%,100%{transform:scale(1)}50%{transform:scale(1.012,1.018)}}
    @keyframes sway {0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(2deg)}}
    @keyframes blink {0%,45%,48%,100%{transform:scaleY(1)}46.5%{transform:scaleY(.08)}}
    @media(prefers-reduced-motion:reduce){#motion-body,#tail,#eyes,#pupils{animation:none}}
    </style>

